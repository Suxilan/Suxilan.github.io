{{- /* 主题色自定义系统的 JavaScript */ -}}
<script>
(function() {
  'use strict';

  // ============================================
  // 工具函数：十六进制转 RGB
  // ============================================
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  // ============================================
  // 应用主题色
  // ============================================
  function applyThemeColor(color) {
    const rgb = hexToRgb(color);
    if (!rgb) return;

    const root = document.documentElement;
    root.style.setProperty('--theme-color', color);
    root.style.setProperty('--theme-color-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);

    // 更新 Giscus 评论区颜色（如果存在）
    updateGiscusColor(color, rgb);

    console.log('✅ 主题色已更新:', color);
  }

  // ============================================
  // 更新 Giscus 评论区颜色
  // ============================================
  function updateGiscusColor(color, rgb) {
    // 检查是否有评论区
    const giscusFrame = document.querySelector('iframe.giscus-frame');
    if (!giscusFrame) {
      console.log('⚠️ 未找到 Giscus iframe，可能当前页面没有评论区');
      return;
    }

    // 获取当前主题（亮色/暗色）
    const isDark = document.documentElement.dataset.theme === 'dark';
    
    // 动态生成自定义主题 CSS
    const customThemeCSS = generateGiscusThemeCSS(color, rgb, isDark);
    
    // 将 CSS 转换为 data URI
    const cssDataUri = `data:text/css;base64,${btoa(unescape(encodeURIComponent(customThemeCSS)))}`;
    
    // 通过 postMessage 发送主题更新消息给 Giscus
    giscusFrame.contentWindow.postMessage(
      {
        giscus: {
          setConfig: {
            theme: cssDataUri
          }
        }
      },
      'https://giscus.app'
    );

    console.log('✅ Giscus 颜色已同步:', color);
  }

  // ============================================
  // 生成 Giscus 自定义主题 CSS
  // ============================================
  function generateGiscusThemeCSS(color, rgb, isDark) {
    // 基础模板（基于 noborder_light/dark）
    const baseColors = isDark ? {
      bg: '22, 22, 24',
      text: '235, 235, 245',
      border: '48, 54, 61'
    } : {
      bg: '246, 246, 247',
      text: '36, 41, 47',
      border: '208, 215, 222'
    };

    return `
/* Giscus 自定义主题 - 动态生成 */
main {
  --primary-default: ${rgb.r}, ${rgb.g}, ${rgb.b};
  --bg-default: ${baseColors.bg};
  --color-prettylights-syntax-entity-tag: ${color};
  --color-prettylights-syntax-string-regexp: ${color};
  --color-prettylights-syntax-markup-inserted-text: ${color};
  --color-prettylights-syntax-markup-inserted-bg: ${isDark ? 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ', 0.15)' : 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ', 0.1)'};
  --color-success-fg: ${color};
  --color-scale-blue-1: rgba(var(--primary-default), 0.15);
  --color-scale-blue-8: rgba(var(--primary-default), 0.15);
}

/* 按钮和链接颜色 */
.gsc-comment-box-tabs button:hover,
.gsc-comment-box-tabs button[aria-selected="true"] {
  border-bottom-color: ${color} !important;
}

.gsc-comment-box .gsc-comment-box-tabs button:hover {
  color: ${color} !important;
}

/* 反应按钮 */
.gsc-reactions button:hover,
.gsc-reactions button.has-reacted {
  border-color: ${color} !important;
}

/* 回复按钮 */
.gsc-reply-button:hover {
  color: ${color} !important;
}

/* 主按钮 */
.gsc-comment-box button.gsc-comment-box-preview-button:hover,
.gsc-comment-box button.gsc-comment-box-write-button:hover {
  color: ${color} !important;
}

/* 链接 */
.gsc-comment a:hover {
  color: ${color} !important;
}

/* 时间轴标记 */
.gsc-timeline-marker {
  background-color: ${color} !important;
}
    `.trim();
  }

  // ============================================
  // 保存主题色到 localStorage
  // ============================================
  function saveThemeColor(color) {
    localStorage.setItem('theme-color', color);
    console.log('💾 主题色已保存到 localStorage:', color);
  }

  // ============================================
  // 从 localStorage 加载主题色
  // ============================================
  function loadThemeColor() {
    const savedColor = localStorage.getItem('theme-color');
    if (savedColor) {
      applyThemeColor(savedColor);
      console.log('📂 已加载保存的主题色:', savedColor);
      return savedColor;
    }
    return '#E58F74'; // 默认橙色
  }

  // ============================================
  // 页面加载时恢复用户选择的颜色
  // ============================================
  document.addEventListener('DOMContentLoaded', function() {
    const savedColor = loadThemeColor();

    // 等待弹窗元素加载
    setTimeout(() => {
      const customColorInput = document.getElementById('custom-color-input');
      if (customColorInput) {
        customColorInput.value = savedColor;
      }

      // 更新预设颜色的激活状态
      document.querySelectorAll('.color-preset').forEach(btn => {
        if (btn.dataset.color === savedColor) {
          btn.classList.add('active');
        }
      });
    }, 100);

    // 等待 Giscus 加载后同步颜色
    waitForGiscusAndSync(savedColor);
  });

  // ============================================
  // 等待 Giscus 加载并同步颜色
  // ============================================
  function waitForGiscusAndSync(color) {
    const rgb = hexToRgb(color);
    if (!rgb) return;

    let attempts = 0;
    const maxAttempts = 50;
    const checkInterval = 200; // 每 200ms 检查一次

    const intervalId = setInterval(() => {
      const giscusFrame = document.querySelector('iframe.giscus-frame');
      
      if (giscusFrame) {
        // Giscus 已加载，等待 iframe 完全准备好
        setTimeout(() => {
          updateGiscusColor(color, rgb);
          console.log('🎨 Giscus 初始颜色已同步');
        }, 500);
        clearInterval(intervalId);
      } else if (attempts >= maxAttempts) {
        // 超时，可能当前页面没有评论区
        clearInterval(intervalId);
        console.log('ℹ️ 当前页面无评论区');
      }
      
      attempts++;
    }, checkInterval);
  }

  // ============================================
  // 监听主题切换（日夜模式）
  // ============================================
  const themeObserver = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      if (mutation.attributeName === 'data-theme') {
        // 主题切换了，重新同步 Giscus 颜色
        const savedColor = localStorage.getItem('theme-color') || '#E58F74';
        const rgb = hexToRgb(savedColor);
        if (rgb) {
          setTimeout(() => {
            updateGiscusColor(savedColor, rgb);
            console.log('🌓 主题切换，Giscus 颜色已同步');
          }, 300);
        }
      }
    });
  });

  // 开始观察 HTML 元素的 data-theme 属性
  themeObserver.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme']
  });

  // ============================================
  // 打开/关闭颜色选择器弹窗
  // ============================================
  const colorToggle = document.getElementById('color-toggle');
  const colorModal = document.getElementById('color-picker-modal');
  const colorModalClose = document.querySelector('.color-modal-close');

  if (colorToggle && colorModal) {
    // 打开弹窗
    colorToggle.addEventListener('click', function() {
      colorModal.style.display = 'flex';
      document.body.style.overflow = 'hidden'; // 防止背景滚动
    });

    // 关闭弹窗
    function closeModal() {
      colorModal.style.display = 'none';
      document.body.style.overflow = '';
    }

    colorModalClose?.addEventListener('click', closeModal);

    // 点击背景关闭
    colorModal.addEventListener('click', function(e) {
      if (e.target === colorModal) {
        closeModal();
      }
    });

    // ESC 键关闭
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && colorModal.style.display === 'flex') {
        closeModal();
      }
    });
  }

  // ============================================
  // 预设颜色按钮
  // ============================================
  document.querySelectorAll('.color-preset').forEach(button => {
    button.addEventListener('click', function() {
      const color = this.dataset.color;
      
      // 更新所有按钮的激活状态
      document.querySelectorAll('.color-preset').forEach(btn => {
        btn.classList.remove('active');
      });
      this.classList.add('active');

      // 同步到自定义颜色输入框
      const customColorInput = document.getElementById('custom-color-input');
      if (customColorInput) {
        customColorInput.value = color;
      }

      // 实时预览
      applyThemeColor(color);
    });
  });

  // ============================================
  // 自定义颜色输入
  // ============================================
  const customColorInput = document.getElementById('custom-color-input');
  if (customColorInput) {
    customColorInput.addEventListener('input', function() {
      const color = this.value;
      
      // 清除预设颜色的激活状态
      document.querySelectorAll('.color-preset').forEach(btn => {
        btn.classList.remove('active');
      });

      // 实时预览
      applyThemeColor(color);
    });
  }

  // ============================================
  // 应用按钮
  // ============================================
  const applyButton = document.getElementById('apply-color');
  if (applyButton) {
    applyButton.addEventListener('click', function() {
      const color = customColorInput.value;
      saveThemeColor(color);
      
      // 关闭弹窗
      colorModal.style.display = 'none';
      document.body.style.overflow = '';

      // 显示成功提示（可选）
      console.log('🎨 主题色应用成功！');
    });
  }

  // ============================================
  // 恢复默认按钮
  // ============================================
  const resetButton = document.getElementById('reset-color');
  if (resetButton) {
    resetButton.addEventListener('click', function() {
      const defaultColor = '#E58F74';
      
      // 应用默认颜色
      applyThemeColor(defaultColor);
      saveThemeColor(defaultColor);
      
      // 更新 UI
      if (customColorInput) {
        customColorInput.value = defaultColor;
      }
      
      document.querySelectorAll('.color-preset').forEach(btn => {
        if (btn.dataset.color === defaultColor) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      console.log('🔄 已恢复默认主题色');
    });
  }

})();
</script>
