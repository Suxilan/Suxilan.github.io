          data-repo="Suxilan/Suxilan.github.io"
          data-repo-id="R_kgDOQO0zsQ"
          data-category="Announcements"
          data-category-id="DIC_kwDOQO0zsc4CxdT7"

{{- /* 主题切换时同步更新 Giscus 主题 */ -}}
<script>
  function setGiscusTheme() {
    function sendMessage() {
      const iframe = document.querySelector('iframe.giscus-frame');
      if (!iframe) return;
      
      const isDark = document.body.className.includes('dark');
      const theme = isDark 
        ? 'https://suxilan.github.io/giscus-custom-dark.css' 
        : 'https://suxilan.github.io/giscus-custom.css';
      
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        'https://giscus.app'
      );
      
      console.log('Giscus theme switched to:', theme);
    }
    sendMessage();
  }
  
  // 页面加载时初始化主题
  window.addEventListener('DOMContentLoaded', function() {
    // 等待 giscus 加载
    setTimeout(() => {
      setGiscusTheme();
    }, 2000);
  });
  
  // 监听主题切换
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.attributeName === 'class') {
        setGiscusTheme();
      }
    });
  });
  
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['class']
  });
  
  // 备用：监听主题按钮点击
  setTimeout(() => {
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        setTimeout(setGiscusTheme, 100);
      });
    }
  }, 1000);
</script>
{{- end }}
