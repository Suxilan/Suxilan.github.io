{{- /* 主题色自定义系统 */ -}}
{{- partial "color-customizer.html" . -}}

<script src="{{ "js/blockquote-math.js" | relURL }}" defer></script>

<script>
  // 1. 阅读进度条逻辑
  window.addEventListener('scroll', function() {
    const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight || document.body.scrollHeight;
    const clientHeight = document.documentElement.clientHeight || document.body.clientHeight;
    const scrolled = (scrollTop / (scrollHeight - clientHeight)) * 100;
    
    const progressBar = document.getElementById('reading-progress-bar');
    if (progressBar) {
      progressBar.style.width = scrolled + '%';
    }
  });

  // 2. 首页副标题打字机效果 (修复选择器)
  document.addEventListener('DOMContentLoaded', function() {
    // PaperMod Profile 模式下，副标题通常在 .profile_inner > span 中
    const subtitleElement = document.querySelector('.profile_inner > span');
    if (subtitleElement) {
      const text = subtitleElement.textContent.trim(); // 去除首尾空格
      if (!text) return; // 如果没有内容则不执行
      
      subtitleElement.textContent = ''; // 清空原始内容
      
      let i = 0;
      function typeWriter() {
        if (i < text.length) {
          subtitleElement.textContent += text.charAt(i);
          i++;
          setTimeout(typeWriter, 100); // 打字速度
        }
      }
      
      // 延迟一点开始打字
      setTimeout(typeWriter, 500);
    }
  });

  // 3. 鼠标点击波纹效果（仅首页）
  document.addEventListener('DOMContentLoaded', function() {
    // 检查是否在首页（Profile Mode）
    const isHomePage = document.querySelector('.profile') !== null;
    
    if (isHomePage) {
      document.addEventListener('click', function(e) {
        // 创建波纹元素
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        
        // 设置波纹初始大小和位置
        const size = 40; // 初始直径
        ripple.style.width = size + 'px';
        ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - size / 2) + 'px';
        ripple.style.top = (e.clientY - size / 2) + 'px';
        
        // 添加到页面
        document.body.appendChild(ripple);
        
        // 动画结束后移除
        setTimeout(function() {
          ripple.remove();
        }, 800);
      });
    }
  });

  // 4. 网站运行时间统计
  function show_runtime() {
    window.setTimeout("show_runtime()", 1000);
    // 请修改这里的建站时间
    X = new Date("11/20/2025 00:00:00");
    Y = new Date();
    T = (Y.getTime() - X.getTime());
    M = 24 * 60 * 60 * 1000;
    a = T / M;
    A = Math.floor(a);
    b = (a - A) * 24;
    B = Math.floor(b);
    c = (b - B) * 60;
    C = Math.floor(c);
    d = (c - C) * 60;
    D = Math.floor(d);
    
    const runtimeSpan = document.getElementById("runtime_span");
    if (runtimeSpan) {
        runtimeSpan.innerHTML = "本站已运行: " + A + "天 " + B + "小时 " + C + "分 " + D + "秒";
    }
  }
  show_runtime();
</script>
