baseURL: https://Suxilan.github.io/
languageCode: zh-cn
title: Suxilan's Blog  # 你的网站标题
theme: PaperMod
# 时区设置为北京时间
timeZone: Asia/Shanghai

# 启用 emoji 支持
enableEmoji: true
# 启用 robots.txt
enableRobotsTXT: true
# 构建草稿
buildDrafts: false
buildFuture: true  # 允许构建未来时间的文章
buildExpired: false

# Google Analytics 4 (GA4)
# 获取方法：https://analytics.google.com/ → 管理 → 数据流 → 衡量ID
# 格式：G-XXXXXXXXXX
googleAnalytics: G-4VWKRYTFHP # 替换为你的实际衡量ID

# 每页显示的文章数
pagination:
  pagerSize: 10

# 最小化输出
minify:
  disableXML: true
  minifyOutput: true

# 语言设置
languages:
  zh:
    languageName: "中文"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 随笔
          url: /posts/
          weight: 1
        - name: 笔记
          url: /notes/
          weight: 2
        - name: 摄影
          url: /photography/
          weight: 3
        - name: 关于
          url: /about/
          weight: 4
        - name: 归档
          url: /archives/
          weight: 5

# 输出格式
outputs:
  home:
    - HTML
    - RSS

# PaperMod 主题参数
params:
  env: production  # 使用 production 以隐藏调试信息
  
  # 网站描述
  description: "Suxilan的个人主页 - CV展示、学习笔记、发表与摄影作品"
  keywords: [Blog, Portfolio, Photography, CV, Notes]
  author: Suxilan
  
  # 图片设置
  images: ["/images/avatar.jpg"]  # 默认分享图片
  
  # Favicon 设置
  assets:
    favicon: "/images/avatar.jpg"
    favicon16x16: "/images/avatar.jpg"
    favicon32x32: "/images/avatar.jpg"
    apple_touch_icon: "/images/avatar.jpg"
  
  # 日期格式
  DateFormat: "2006-01-02"
  
  # 默认主题：auto, dark, light
  defaultTheme: auto
  # 禁用主题切换按钮
  disableThemeToggle: false
  
  # 显示阅读时间
  ShowReadingTime: true
  # 显示分享按钮
  ShowShareButtons: false  # 关闭文章底部的社交分享图标
  # 显示文章导航（上一篇/下一篇）
  ShowPostNavLinks: true
  # 显示面包屑导航
  ShowBreadCrumbs: true
  # 显示代码复制按钮
  ShowCodeCopyButtons: true
  # 显示文章字数统计
  ShowWordCount: true
  # 在列表中显示完整内容
  ShowFullTextinRSS: true
  # 显示目录
  ShowToc: true
  # 默认展开目录
  TocOpen: false
  
  # 评论系统（可选，多种选择）
  comments: false  # 全局默认不启用，在需要的文章中单独开启
  
  # Profile Mode - 首页个人资料模式
  profileMode:
    enabled: true
    title: "My Wilderness"
    subtitle: "记录、思考、探索"
    imageUrl: "/images/avatar.jpg"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: 旷野
        url: /posts/
      - name: 关于
        url: /about/
  
  # 社交图标
  socialIcons:
  - name: github
    url: "https://github.com/Suxilan"
    title: "访问我的 GitHub"
    
  - name: email
    url: "mailto:shixulei@whu.edu.cn"
    title: "发送邮件给我"
    
  - name: qq
    url: "/images/qrcode/qq-qrcode.jpg"
    title: "QQ二维码"
    
  - name: 500px
    url: "https://500px.com.cn/Asuka0312"
    title: "我的摄影作品"
  
  # 编辑文章链接（如果使用 GitHub）
  # editPost:
  #   URL: "https://github.com/yourusername/yourrepo/tree/main/content"
  #   Text: "建议修改"
  #   appendFilePath: true
  
  # 分析工具（可选）
  analytics:
    google:
      SiteVerificationTag: ""  # Google Search Console 验证
  
  # 封面图片设置
  cover:
    hidden: false  # 在所有页面隐藏封面
    hiddenInList: false  # 在列表中隐藏封面
    hiddenInSingle: false  # 在单页中隐藏封面
    linkFullImages: true
    responsiveImages: true
  
  # 搜索设置
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# Markdown 渲染设置
markup:
  goldmark:
    renderer:
      unsafe: true  # 允许 HTML
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    lineNos: true
    noClasses: false
    style: monokai  # 代码高亮主题

# 隐私设置
privacy:
  vimeo:
    disabled: false
    simple: true
  x:  # Twitter 已更名为 X
    disabled: false
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true

# 服务设置
services:
  instagram:
    disableInlineCSS: true
  x:  # Twitter 已更名为 X
    disableInlineCSS: true
