baseurl: https://Suxilan.github.io/
languageCode: zh-cn
title: "Suxilan's Blog"
theme: hugo-theme-stack
timeZone: Asia/Shanghai

enableGitInfo: true
enableEmoji: true
enableRobotsTXT: true
hasCJKLanguage: true

pagination:
  pagerSize: 5

taxonomies:
  category: categories
  tag: tags
  series: series

services:
  googleAnalytics:
    id: G-4VWKRYTFHP

params:
  mainSections:
    - notes
    - posts

  rssFullContent: true

  # 浏览器标签页/收藏夹图标
  favicon: /images/avatar.jpg

  sidebar:
    subtitle: "记录、思考、探索"
    # 头像右下角的小图案（官方模板同款位置）
    # 留空/删除则不显示
    emoji: "🐦︎"
    avatar:
      enabled: true
      local: false
      src: /images/avatar.jpg

  article:
    math: true
    toc: true
    readingTime: true

  comments:
    enabled: true
    provider: giscus

    giscus:
      repo: Suxilan/Suxilan.github.io
      repoID: R_kgDOQO0zsQ
      category: Announcements
      categoryID: DIC_kwDOQO0zsc4CxdT7
      mapping: pathname
      strict: 0
      lightTheme: light
      darkTheme: dark
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      lang: zh-CN

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  colorScheme:
    toggle: true
    default: auto

  homepage:
    profile:
      enabled: true
      title: "My Wilderness"
      subtitle: "记录、思考、探索"
      imageUrl: "/images/avatar.jpg"
      background: "/images/background.jpg"
      showSocial: true
      buttons:
        - name: 博客
          url: /blog/
        - name: 关于
          url: /about/

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
      params:
        icon: home
    - identifier: blog
      name: 博客
      url: /blog/
      weight: 5
      params:
        icon: hash
    - identifier: posts
      name: 随笔
      url: /posts/
      weight: 10
      params:
        icon: pencil
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 20
      params:
        icon: book
    - identifier: photography
      name: 摄影
      url: /photography/
      weight: 30
      params:
        icon: camera
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
      params:
        icon: user
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 50
      params:
        icon: archives
    - identifier: search
      name: 搜索
      url: /search/
      weight: 60
      params:
        icon: search

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/Suxilan
      params:
        icon: brand-github
    - identifier: email
      name: Email
      url: mailto:shixulei@whu.edu.cn
      params:
        icon: messages
    - identifier: 500px
      name: 500px
      url: https://500px.com.cn/Asuka0312
      params:
        icon: brand-500px
    - identifier: xiaohongshu
      name: 小红书
      url: https://www.xiaohongshu.com/user/profile/5f51ba2b0000000001004de7
      params:
        icon: brand-rednote

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \\[ 
              - \\]
            - - $$
              - $$
          inline:
            - - \\( 
              - \\)
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
