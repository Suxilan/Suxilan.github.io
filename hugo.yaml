baseurl: https://Suxilan.github.io/
languageCode: zh-cn
title: "Suxilan's Blog"
theme: hugo-theme-stack
timeZone: Asia/Shanghai

enableGitInfo: true
enableEmoji: true
enableRobotsTXT: true
hasCJKLanguage: true

pagination:
  pagerSize: 5

taxonomies:
  category: categories
  tag: tags
  series: series

services:
  googleAnalytics:
    id: G-4VWKRYTFHP

params:
  mainSections:
    - notes
    - posts

  rssFullContent: true

  sidebar:
    subtitle: "记录、思考、探索"
    avatar:
      enabled: true
      local: false
      src: /images/avatar.jpg

  article:
    math: true
    toc: true
    readingTime: true

  comments:
    enabled: false

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  colorScheme:
    toggle: true
    default: auto

menu:
  main:
    - identifier: posts
      name: 随笔
      url: /posts/
      weight: 10
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 20
    - identifier: photography
      name: 摄影
      url: /photography/
      weight: 30

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/Suxilan
      params:
        icon: brand-github
    - identifier: email
      name: Email
      url: mailto:shixulei@whu.edu.cn
      params:
        icon: messages

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \\[ 
              - \\]
            - - $$
              - $$
          inline:
            - - \\( 
              - \\)
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
